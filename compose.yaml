services:
  postgres:
    image: postgres:17-alpine
    container_name: unihub-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unihub_db}
      POSTGRES_USER: ${POSTGRES_USER:-unihub_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unihub_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - database

  minio:
    image: minio/minio:latest
    container_name: unihub-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - s3

volumes:
  postgres_data:
  minio_data:

networks:
  database:
    driver: bridge
    external: false
  s3:
    driver: local
    external: false
