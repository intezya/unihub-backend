services:
  traefik:
    image: traefik:v3.2
    container_name: unihub-traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8088:8088"
    environment:
      - TZ=Europe/Moscow
      - ACME_EMAIL=${ACME_EMAIL:-admin@intezya.ru}
    command:
      - --log.level=INFO
      - --accesslog=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik-public
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@intezya.ru}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --ping=true
      - --ping.entrypoint=web
      - --api.dashboard=true
      - --api.insecure=true
      - --entrypoints.traefik.address=:8088
      - --accesslog.fields.defaultmode=keep
      - --accesslog.fields.headers.defaultmode=drop
      - --accesslog.fields.headers.names.Cookie=keep
      - --accesslog.fields.headers.names.Set-Cookie=keep
      - --accesslog.fields.headers.names.User-Agent=keep
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/letsencrypt
    networks:
      - traefik-public
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:80/ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:17-alpine
    container_name: unihub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unihub_db}
      POSTGRES_USER: ${POSTGRES_USER:-unihub_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unihub_password}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h localhost || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    networks:
      - database
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: .
    image: ghcr.io/intezya/unihub-backend:latest
    container_name: unihub-backend
    restart: unless-stopped
    depends_on:
      traefik:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.unihub-backend.rule=Host(`backend.hackathon-max.prod.stands.intezya.ru`)"
      - "traefik.http.routers.unihub-backend.entrypoints=websecure"
      - "traefik.http.routers.unihub-backend.tls=true"
      - "traefik.http.routers.unihub-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.unihub-backend.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.unihub-backend-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.unihub-backend-ratelimit.ratelimit.burst=50"
      - "traefik.http.routers.unihub-backend.middlewares=unihub-backend-ratelimit"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-production}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-unihub_db}
      - POSTGRES_USER=${POSTGRES_USER:-unihub_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-unihub_password}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_PUBLIC_ENDPOINT=https://s3.hackathon-max.prod.stands.intezya.ru
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-unihub}
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    networks:
      - traefik-public
      - database
      - s3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --address ":9000" --console-address ":9001"
    container_name: unihub-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BROWSER_REDIRECT_URL: https://s3.hackathon-max.prod.stands.intezya.ru
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9000/minio/health/ready || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.unihub-minio.rule=Host(`s3.hackathon-max.prod.stands.intezya.ru`)"
      - "traefik.http.routers.unihub-minio.entrypoints=websecure"
      - "traefik.http.routers.unihub-minio.tls.certresolver=letsencrypt"
      - "traefik.http.services.unihub-minio.loadbalancer.server.port=9000"
    networks:
      - s3
      - traefik-public
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  frontend:
    image: ghcr.io/kukushka-glitch/max-hack-front:latest
    container_name: unihub-frontend
    restart: unless-stopped
    depends_on:
      traefik:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    security_opt:
      - no-new-privileges:true
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.unihub-frontend.rule=Host(`frontend.hackathon-max.prod.stands.intezya.ru`)"
      - "traefik.http.routers.unihub-frontend.entrypoints=websecure"
      - "traefik.http.routers.unihub-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.unihub-frontend.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.unihub-frontend-compress.compress=true"
      - "traefik.http.middlewares.unihub-frontend-security.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.unihub-frontend-security.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.unihub-frontend-security.headers.stsPreload=true"
      - "traefik.http.routers.unihub-frontend.middlewares=unihub-frontend-compress,unihub-frontend-security"
    networks:
      - traefik-public
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: unihub-watchtower
    restart: unless-stopped
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_TIMEOUT=60s
      - WATCHTOWER_ROLLING_RESTART=true
      - WATCHTOWER_ROLLING_RESTART_COUNT=1
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_DEBUG=false
      - WATCHTOWER_NO_STARTUP_MESSAGE=false
      - WATCHTOWER_REGISTRY_AUTH=ghcr.io
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ~/.docker/config.json:/config.json:ro
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    security_opt:
      - no-new-privileges:true
    networks:
      - traefik-public
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  postgres-data:
    name: unihub_postgres_data
  minio-data:
    name: unihub_minio_data
  traefik-certificates:
    name: unihub_traefik_certificates
    driver: bridge

networks:
  database:
    driver: bridge
    name: unihub_database_network
  s3:
    driver: bridge
    name: unihub_s3_network
  traefik-public:
    name: traefik-public
    driver: bridge
